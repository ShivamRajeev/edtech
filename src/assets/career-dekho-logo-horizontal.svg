<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 320" preserveAspectRatio="xMinYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Career Dekho Logo</title>
  <desc id="desc">Circular arrow and ladder mark with Career Dekho wordmark and tagline.</desc>

  <defs>
    <linearGradient id="circleGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#123a73" />
      <stop offset="58%" stop-color="#1c4f83" />
      <stop offset="100%" stop-color="#69bc45" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58b63e" />
