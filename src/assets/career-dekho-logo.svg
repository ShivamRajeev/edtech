<svg xmlns="http://www.w3.org/2000/svg" viewBox="92 12 576 294" preserveAspectRatio="xMinYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Career Dekho Logo</title>
  <desc id="desc">Graduation cap logo with arrow and tagline Learn. Prepare. Get Hired.</desc>

  <defs>
    <linearGradient id="capTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#44C2FF"/>
      <stop offset="55%" stop-color="#2A8FFF"/>
      <stop offset="100%" stop-color="#1D65D8"/>
    </linearGradient>
    <linearGradient id="capBand" x1="0" y1="0" x2="1" y2="1">
