<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Career Dekho Logo</title>
  <desc id="desc">Graduation cap icon with stacked Career Dekho wordmark and tagline.</desc>

  <defs>
    <linearGradient id="capTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#49c9ff" />
      <stop offset="55%" stop-color="#2f97ee" />
      <stop offset="100%" stop-color="#1b67d6" />
    </linearGradient>
    <linearGradient id="capBand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#184cb9" />
      <stop offset="100%" stop-color="#2c77ea" />
    </linearGradient>
    <linearGradient id="bodyLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb23f" />
      <stop offset="100%" stop-color="#ff8a18" />
    </linearGradient>
    <linearGradient id="bodyMid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd64a" />
      <stop offset="100%" stop-color="#ffb62a" />
    </linearGradient>
    <linearGradient id="bodyRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8f2a" />
      <stop offset="100%" stop-color="#f66a11" />
    </linearGradient>
  </defs>

  <rect width="500" height="500" fill="#120953" />

  <g transform="translate(55 72)">
    <polygon points="195,8 30,82 195,155 360,82" fill="url(#capTop)"/>
    <polygon points="195,38 68,96 195,155 322,96" fill="#4fb8ff" opacity="0.35"/>
    <polygon points="72,96 195,151 318,96 318,106 195,161 72,106" fill="url(#capBand)"/>

    <polygon points="127,106 195,137 263,106 263,194 195,224 127,194" fill="url(#bodyMid)"/>
    <polygon points="127,106 195,137 195,224 127,194" fill="url(#bodyLeft)"/>
    <polygon points="195,137 263,106 263,194 195,224" fill="url(#bodyRight)"/>

    <path d="M198 92c42-9 72-9 112 0" fill="none" stroke="#ffe7b2" stroke-width="7" stroke-linecap="round"/>
    <circle cx="198" cy="92" r="7" fill="#2f7af0"/>
    <path d="M81 101c-14 5-24 14-24 28v34" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <rect x="51" y="164" width="14" height="33" rx="7" fill="#ffbd2e"/>

    <path d="M314 34l42-20l-12 42l-13-13l-16 31l-16-5l16-30z" fill="#ffad2e"/>
  </g>

  <text x="250" y="340" text-anchor="middle" fill="#3fd0ff" font-family="Georgia, 'Times New Roman', serif" font-size="56" letter-spacing="3">
    CAREER
  </text>
  <text x="250" y="368" text-anchor="middle" fill="#ffffff" font-family="Manrope, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="1.2">
    LEARN. PREPARE. GET HIRED.
  </text>
  <text x="250" y="408" text-anchor="middle" fill="#3fd0ff" font-family="Georgia, 'Times New Roman', serif" font-size="56" letter-spacing="3">
    DEKHO
  </text>
</svg>
