<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Single Page App</title>
    <script type="text/javascript">
      // This script handles GitHub Pages SPA routing
      // When a 404 is triggered, redirect to index.html with the requested path
      var l = window.location;
      
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          '/index.html?p=' +
          encodeURIComponent(l.pathname) +
          '&q=' +
          encodeURIComponent(l.search)
      );
    </script>
  </head>
  <body></body>
</html>
